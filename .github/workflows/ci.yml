name: CloudOps CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r app/requirements.txt

      - name: Build Docker Image
        run: docker build -t cloudops-api:${{ github.sha }} .



      
        run: docker build -t cloudops-api:ci .
      
  
